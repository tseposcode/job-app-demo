<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Auto">
<meta name="theme-color" content="#0F6B4F">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Job Auto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app; one narrow column, fixed tab bar at the bottom, bottom sheets for detail and forms */
:root{
  --bg:#3012c8; --surface:#360202; --ink:#142019; --muted:#5B6A60; --line:#DAE2DB;
  --accent:#6b0f0f; --accent-ink:#FFFFFF; --accent-soft:#DDEFE6;
  --gold:#946112; --gold-soft:#FAEED6;
  --bad:#A8322A; --bad-soft:#FBE4E1;
  --shadow:rgb(15 40 28 / .07); --scrim:rgb(8 16 12 / .5);
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1310; --surface:#151D19; --ink:#E5ECE7; --muted:#98A79D; --line:#25302A;
  --accent:#52C79B; --accent-ink:#05140E; --accent-soft:#16332A;
  --gold:#EDBB62; --gold-soft:#372A12;
  --bad:#F08A80; --bad-soft:#3A1B18;
  --shadow:rgb(0 0 0 / .35); --scrim:rgb(0 0 0 / .65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1310; --surface:#151D19; --ink:#E5ECE7; --muted:#98A79D; --line:#25302A;
  --accent:#52C79B; --accent-ink:#05140E; --accent-soft:#16332A;
  --gold:#EDBB62; --gold-soft:#372A12;
  --bad:#F08A80; --bad-soft:#3A1B18;
  --shadow:rgb(0 0 0 / .35); --scrim:rgb(0 0 0 / .65); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
body.no-tabs{padding-block:18px 32px}
h1,h2,h3,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
h1{font-family:var(--f-display);font-weight:800;font-size:1.75rem;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
h2{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
h3,.jt{font-family:var(--f-display);font-weight:600;font-size:1.12rem;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
a{color:var(--accent)}

.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:18px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.wordmark i{display:inline-block;width:22px;height:22px;border-radius:7px;background:var(--accent);position:relative;flex:none}
.wordmark i::after{content:"";position:absolute;left:6px;top:5px;width:8px;height:5px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:rotate(-45deg)}
.pill{font-size:.72rem;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.hello{display:flex;flex-direction:column;gap:6px}

/* Buttons and fields */
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;
  padding:10px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;-webkit-tap-highlight-color:transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.86rem;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:.82rem;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:88px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.err{color:var(--bad);font-size:.86rem;font-weight:500}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{position:relative}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check span{display:inline-flex;align-items:center;font-size:.86rem;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.check input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.check input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.status{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:14px;padding:12px 14px}
.status.warn{background:var(--gold-soft)}
.status .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.status.off .dot{background:var(--muted);box-shadow:none}
.status.warn .dot{background:var(--gold);box-shadow:none}
.status>div{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.status strong{font-weight:700}

.section{display:flex;flex-direction:column;gap:10px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.toolbar{display:flex;flex-direction:column;gap:10px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select{width:auto;min-height:38px;padding:6px 10px;font-size:.86rem;border-radius:999px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:.84rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.jobs{display:flex;flex-direction:column;gap:12px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px var(--shadow)}
.job-open{all:unset;display:flex;flex-direction:column;gap:12px;cursor:pointer;border-radius:10px}
.job-open:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.job-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.job-h>div{min-width:0;display:flex;flex-direction:column;gap:3px}
.who{font-size:.86rem;color:var(--muted)}
.match{flex:none;font-size:.78rem;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:4px 9px;border-radius:999px;white-space:nowrap}
.match.hi{color:var(--accent);background:var(--accent-soft)}
.match.lo{color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px}
.fact{display:flex;align-items:center;gap:6px;font-size:.86rem;min-width:0}
.fact svg{width:15px;height:15px;flex:none;color:var(--muted)}
.pay{font-family:var(--f-display);font-weight:600;font-size:1.2rem;letter-spacing:-.01em}
.pay small{font-family:var(--f-body);font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:0}
.job-f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line);font-size:.82rem}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent);font-size:.84rem}
.tag svg{width:14px;height:14px}
.empty{text-align:center;padding:28px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

.state{flex:none;font-size:.78rem;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.state.interview{color:var(--accent);background:var(--accent-soft)}
.state.viewed{color:var(--gold);background:var(--gold-soft)}
.state.sent{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.state.rejected{color:var(--bad);background:var(--bad-soft)}
.state.withdrawn{color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1px var(--line);text-decoration:line-through}
.track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.track li{display:flex;flex-direction:column;gap:6px;font-size:.74rem;color:var(--muted)}
.track li::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.track li.done{color:var(--ink);font-weight:600}
.track li.done::before{background:var(--accent)}
.track li.fail{color:var(--bad);font-weight:600}
.track li.fail::before{background:var(--bad)}

/* Profile */
.who-card{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-block:6px 4px}
.avatar{width:96px;height:96px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;
  background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:2rem;letter-spacing:-.02em;
  display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .cam{position:absolute;right:3px;bottom:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px var(--shadow)}
.avatar .cam svg{width:14px;height:14px}
.role{font-size:.92rem;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:8rem minmax(0,1fr);gap:12px;padding:12px 16px;align-items:baseline}
.row+.row,.list>*+*{border-top:1px solid var(--line)}
.row dt{font-size:.84rem;color:var(--muted)}
.row dd{font-weight:500;overflow-wrap:anywhere}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.cv{display:flex;align-items:center;gap:12px;padding:12px 16px}
.cv .doc{width:38px;height:46px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;letter-spacing:.04em;flex:none}
.cv>div{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.cv strong{font-weight:600;overflow-wrap:anywhere}
.cv span{font-size:.8rem;color:var(--muted)}
.cv-actions{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.setting>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.setting span{font-size:.8rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{font:inherit;font-size:.84rem;font-weight:600;background:transparent;color:var(--ink);border:0;padding:8px 12px;cursor:pointer;min-height:38px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line);border:0;padding:0;position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .25)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:23px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.range-row{display:grid;grid-template-columns:minmax(0,1fr) 3.2rem;gap:10px;align-items:center;padding:0 16px 14px}
.range-row output{text-align:right;font-weight:700}
.sample{font-size:.78rem;color:var(--muted);text-align:center;text-wrap:balance}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skill{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.skill.miss{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;
  padding-top:calc(24px + env(safe-area-inset-top,0px))}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:100%;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:sticky;top:-18px;background:var(--bg);padding-block:6px;z-index:1}
.sheet-h>div{min-width:0;display:flex;flex-direction:column;gap:4px}
.x{font:inherit;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.x svg{width:16px;height:16px}
.why{display:flex;flex-direction:column;gap:8px}
.why li{display:flex;align-items:flex-start;gap:8px;font-size:.88rem}
.why li b{flex:none;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;margin-top:1px}
.why li.ok b{background:var(--accent-soft);color:var(--accent)}
.why li.no b{background:var(--bad-soft);color:var(--bad)}
.prose{white-space:pre-line}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}

/* Admin */
.adm-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}
.adm-row>div{min-width:0;display:flex;flex-direction:column;gap:2px}
.adm-row strong{font-weight:600;overflow-wrap:anywhere}
.adm-row .btns{display:flex;gap:6px;flex:none}
.pin{display:flex;gap:10px;justify-content:center}
.pin input{width:3.2rem;text-align:center;font-size:1.4rem;font-weight:700;padding:8px 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.4rem;font-weight:800}
.stat span{font-size:.76rem;color:var(--muted)}

/* Tabs, toast */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{font:inherit;font-size:.74rem;font-weight:600;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;border-radius:10px;position:relative;-webkit-tap-highlight-color:transparent}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:500;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px var(--shadow)}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--bad-soft);border-radius:12px;padding:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: no-preference){.switch::after{transition:left .18s ease}.switch{transition:background-color .18s}}
@media (max-width:360px){.grid2{grid-template-columns:1fr}.row{grid-template-columns:6.5rem minmax(0,1fr)}.stats{grid-template-columns:1fr 1fr}}
</style>

<div class="app">
  <header class="topline">
    <span class="wordmark"><i aria-hidden="true"></i>Job Auto</span>
    <span class="pill" id="topPill">Test version</span>
  </header>
  <div id="view" class="view" aria-live="polite"></div>
  <p class="sample">Test version. Jobs and companies are made up. Everything you enter stays on this device.</p>
</div>

<nav class="tabs" id="tabs" aria-label="Pages" hidden>
  <div class="tabs-in">
    <button type="button" class="tab" data-go="jobs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
      Jobs
    </button>
    <button type="button" class="tab" data-go="applied">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      Applied<span class="badge" id="badge" hidden></span>
    </button>
    <button type="button" class="tab" data-go="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      Profile
    </button>
  </div>
</nav>

<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="photoInput" class="sr" accept="image/*" tabindex="-1">
<input type="file" id="cvInput" class="sr" accept=".pdf,.doc,.docx,application/pdf" tabindex="-1">

<script>
(function(){
'use strict';

/* ---------- Reference data ---------- */
var FIELDS = ['Supply chain','Data and analytics','IT and software','Finance and accounting','Engineering','Marketing','Human resources','Admin and customer service'];
var TYPES = ['Internship','Learnership','Graduate programme','Entry-level job'];
var QUALS = ['Matric','Diploma','Degree','Honours'];
var PROVINCES = ['Gauteng','Western Cape','KwaZulu-Natal','Eastern Cape','Free State','Limpopo','Mpumalanga','North West','Northern Cape'];
var MODES = ['On-site','Hybrid','Remote'];
var TEST_EMAIL = 'thabang@test.com', TEST_PASS = 'jameson', DEFAULT_PIN = '2468';
var DAY = 86400000, MIN = 60000;

function J(id,title,company,type,field,city,province,mode,qual,pay,posted,closes,skills,desc){
  return {id:id,title:title,company:company,type:type,field:field,city:city,province:province,mode:mode,qual:qual,pay:pay,posted:posted,closes:closes,skills:skills,desc:desc};
}
var SEED_JOBS = [

function load(){
  if(mem) return mem;

}

function hashPass(s){
  // Demo-only hash so passwords are not stored as plain text on the device
  var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(var i=0;i<s.length;i++){ var c=s.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16)+(h1>>>0).toString(16);
}

/* ---------- IndexedDB for CV files ---------- */
var idb = null;
function db(){
  if(idb) return idb;
  idb = new Promise(function(res,rej){
    try{
      var r = indexedDB.open('jobauto-files',1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('cv'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    }catch(e){ rej(e); }
  });
  return idb;
}
var cvMemory = {};
function putCv(email,file){
  cvMemory[email] = file;
  return db().then(function(d){ return new Promise(function(res){ var t=d.transaction('cv','readwrite'); t.objectStore('cv').put(file,email); t.oncomplete=function(){res();}; t.onerror=function(){res();}; }); }).catch(function(){});
}
function getCv(email){
  if(cvMemory[email]) return Promise.resolve(cvMemory[email]);
  return db().then(function(d){ return new Promise(function(res){ var q=d.transaction('cv').objectStore('cv').get(email); q.onsuccess=function(){res(q.result||null);}; q.onerror=function(){res(null);}; }); }).catch(function(){ return null; });
}
function delCv(email){
  delete cvMemory[email];
  return db().then(function(d){ d.transaction('cv','readwrite').objectStore('cv').delete(email); }).catch(function(){});
}

function fmtDate(iso){ var p = String(iso).split('-'); if(p.length<3) return iso; return (+p[2])+' '+MONTHS[+p[1]-1]+' '+p[0]; }
function ago(t){
  var d = Date.now()-t;
  if(d < MIN) return 'just now';
  if(d < 60*MIN) return Math.floor(d/MIN)+' min ago';
  if(d < DAY) return Math.floor(d/3600000)+' h ago';

}

}

/* ---------- Matching ---------- */
function qualLevel(q){ return QUALS.indexOf(q); }
function match(user, job){
  var p = user.prefs||{}, reasons = [], score = 0;
  var fieldOk = (p.fields||[]).indexOf(job.field) > -1;
  if(fieldOk) score += 30; reasons.push({ok:fieldOk, text: fieldOk ? 'In a field you want: '+job.field : job.field+' is not one of your fields'});
  var typeOk = (p.types||[]).indexOf(job.type) > -1;
  if(typeOk) score += 15; reasons.push({ok:typeOk, text: typeOk ? job.type+' is a type you want' : job.type+' is not a type you picked'});
  var qualOk = qualLevel(user.qual) >= qualLevel(job.qual);
  if(qualOk) score += 20; reasons.push({ok:qualOk, text: qualOk ? 'You meet the '+job.qual.toLowerCase()+' requirement' : 'Needs at least a '+job.qual.toLowerCase()});
  var locOk = job.mode==='Remote' ? !!p.remote || (p.provinces||[]).indexOf(job.province)>-1 : (p.provinces||[]).indexOf(job.province) > -1;
  if(locOk) score += 15; reasons.push({ok:locOk, text: locOk ? (job.mode==='Remote' ? 'Remote, and you are open to remote work' : job.province+' is a province you picked') : (job.mode==='Remote' ? 'Remote, but you have not chosen remote work' : job.province+' is outside your provinces')});
  var payOk = !p.minPay || job.pay >= p.minPay;
  score += payOk ? 10 : Math.max(0, Math.round(10 * job.pay / p.minPay) - 5);
  reasons.push({ok:payOk, text: payOk ? money(job.pay)+' meets your minimum of '+money(p.minPay||0) : money(job.pay)+' is below your minimum of '+money(p.minPay)});
  var mine = (user.skills||[]).map(function(s){ return s.toLowerCase(); });
  var have = job.skills.filter(function(s){ return mine.indexOf(s.toLowerCase()) > -1; });
  score += Math.round(10 * have.length / Math.max(1, job.skills.length));
  reasons.push({ok: have.length>0, text: have.length ? 'You have '+have.length+' of '+job.skills.length+' listed skills' : 'None of the listed skills are on your profile'});
  return {score: Math.max(0, Math.min(100, score)), qualOk: qualOk, locOk: locOk, reasons: reasons, have: have};
}
function profileGaps(u){
  var g = [];
  if(!u.name || !u.surname) g.push('your name');
  if(!u.qual) g.push('your highest qualification');
  if(!u.prefs || !(u.prefs.fields||[]).length) g.push('the fields you want');
  if(!u.prefs || !(u.prefs.types||[]).length) g.push('the job types you want');
  if(!u.prefs || (!(u.prefs.provinces||[]).length && !u.prefs.remote)) g.push('where you want to work');
  if(!u.cv) g.push('your CV');
  return g;
}
function completeness(u){
  var parts = [u.name&&u.surname, u.phone, u.city&&u.province, u.qual, u.study, (u.skills||[]).length, u.experience, (u.prefs&&(u.prefs.fields||[]).length), (u.prefs&&(u.prefs.types||[]).length), u.cv];
  return Math.round(100 * parts.filter(Boolean).length / parts.length);
}

/* ---------- Applications and simulated employer replies ---------- */
function mkApp(s, jobId, email, method, at, plan){
  var job = null; for(var i=0;i<s.jobs.length;i++) if(s.jobs[i].id===jobId) job=s.jobs[i];
  var u = s.users[email] || mem && mem.users[email];
  var id = 'a'+uid();
  if(!plan){
    var sc = job && u ? match(u, job).score : 60;
    var r = rand(id);
    var interviewChance = sc >= 90 ? 0.6 : sc >= 75 ? 0.4 : 0.2;
    plan = {
      viewAfter: Math.round((1 + rand(id+'v')*1.5) * MIN),
      decideAfter: Math.round((3 + rand(id+'d')*3) * MIN),
      outcome: r < interviewChance ? 'interview' : 'rejected'
    };
  }
  return {id:id, jobId:jobId, email:email, method:method, at:at, plan:plan, withdrawnAt:null,
    jobTitle: job?job.title:'', company: job?job.company:''};
}
function statusOf(a, now){
  now = now || Date.now();
  if(a.withdrawnAt) return {key:'withdrawn', label:'Withdrawn', changed:a.withdrawnAt};
  var tView = a.at + a.plan.viewAfter, tDecide = a.at + a.plan.decideAfter;
  if(now >= tDecide) return a.plan.outcome==='interview' ? {key:'interview', label:'Interview', changed:tDecide} : {key:'rejected', label:'Not successful', changed:tDecide};
  if(now >= tView) return {key:'viewed', label:'Viewed', changed:tView};
  return {key:'sent', label:'Sent', changed:a.at};
}
function myApps(){ var u=me(); return mem.apps.filter(function(a){ return u && a.email===u.email; }).sort(function(a,b){ return b.at-a.at; }); }
function appFor(jobId){ var u=me(); for(var i=0;i<mem.apps.length;i++){ var a=mem.apps[i]; if(u && a.email===u.email && a.jobId===jobId && !a.withdrawnAt) return a; } return null; }
function apply(jobId, method){
  var u = me(); if(!u || appFor(jobId)) return null;
  var a = mkApp(mem, jobId, u.email, method, Date.now());
  mem.apps.push(a); save(); return a;
}
function withdraw(appId){
  mem.apps.forEach(function(a){ if(a.id===appId) a.withdrawnAt = Date.now(); }); save();
}
function runAuto(silent){
  var u = me(); if(!u || u.auto.mode!=='auto' || u.auto.paused || profileGaps(u).length) return 0;
  var n = 0;
  mem.jobs.forEach(function(job){
    if(isClosed(job) || appFor(job.id)) return;
    var withdrawn = mem.apps.some(function(a){ return a.email===u.email && a.jobId===job.id && a.withdrawnAt; });
    if(withdrawn) return;
    var m = match(u, job);
    if(m.qualOk && m.locOk && m.score >= u.auto.min){ mem.apps.push(mkApp(mem, job.id, u.email, 'auto', Date.now())); n++; }
  });
  if(n){ save(); if(!silent) toast('Auto-apply sent your CV to '+n+' new '+(n===1?'job':'jobs')+'.'); }
  return n;
}
function unseen(){
  var u = me(); if(!u) return 0; var now = Date.now();
  return myApps().filter(function(a){ var s=statusOf(a,now); return s.key!=='sent' && s.key!=='withdrawn' && s.changed > (u.lastSeen||0); }).length;
}

function jobCard(u, job){

function filteredJobs(u){
  var q = ui.q.trim().toLowerCase();
  var list = mem.jobs.filter(function(j){
    if(ui.type && j.type!==ui.type) return false;
    if(ui.field && j.field!==ui.field) return false;
    if(ui.province && (ui.province==='Remote' ? j.mode!=='Remote' : j.province!==ui.province)) return false;
    if(q && (j.title+' '+j.company+' '+j.city+' '+j.field+' '+j.skills.join(' ')).toLowerCase().indexOf(q)===-1) return false;
    return true;
  });
  list.sort(function(a,b){
    if(ui.sort==='new') return b.posted.localeCompare(a.posted);
    if(ui.sort==='closing') return a.closes.localeCompare(b.closes);
    if(ui.sort==='pay') return b.pay-a.pay;
    return match(u,b).score - match(u,a).score;
  });
  return list;
}

function trackHtml(s){
  var k = s.key;
  var step2 = (k==='viewed'||k==='interview'||k==='rejected') ? 'done' : '';
  var step3 = k==='interview' ? 'done' : k==='rejected' ? 'fail' : '';
  return '<ol class="track" aria-label="Application progress"><li class="done">Sent</li><li class="'+step2+'">Viewed</li><li class="'+step3+'">'+(k==='rejected'?'Not successful':'Interview')+'</li></ol>';
}
function viewApplied(){

  var shown = apps.filter(function(a){ var k=statusOf(a,now).key; return ui.appFilter==='all' || (ui.appFilter==='active' ? (k==='sent'||k==='viewed') : k===ui.appFilter); });

    (shown.length ? '<ul class="jobs">'+shown.map(function(a){

  $$('[data-close]', root).forEach(function(b){ b.addEventListener('click', closeSheet); });
  document.body.style.overflow = 'hidden';

    u.skills=$('#pSkills').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    u.experience=$('#pExp').value.trim();
    u.prefs={fields:vals('pf'), types:vals('pt'), provinces:vals('pp'), remote:$('#pRemote').checked, minPay:Math.max(0, parseInt($('#pPay').value,10)||0)};
    save(); closeSheet(); toast('Profile saved.'); runAuto(); render();
  });
}

function openJobEdit(id){
  var j = id ? jobById(id) : {title:'',company:'',type:TYPES[0],field:FIELDS[0],city:'',province:'Gauteng',mode:'On-site',qual:'Degree',pay:'',closes:'',skills:[],desc:''};
  openSheet(
    '<div class="sheet-h"><div><h3>'+(id?'Edit job':'Add job')+'</h3><span class="who">Saved on this device.</span></div><button class="x" data-close aria-label="Close">'+ICON.x+'</button></div>'+
    '<form class="form" id="jForm" novalidate>'+
      '<label class="field"><span>Job title</span><input type="text" id="jTitle" value="'+esc(j.title)+'"></label>'+
      '<label class="field"><span>Company</span><input type="text" id="jCompany" value="'+esc(j.company)+'"></label>'+
      '<div class="grid2"><label class="field"><span>Type</span>'+select('jType', TYPES, j.type)+'</label><label class="field"><span>Field</span>'+select('jField', FIELDS, j.field)+'</label></div>'+
      '<div class="grid2"><label class="field"><span>Town or city</span><input type="text" id="jCity" value="'+esc(j.city)+'"></label><label class="field"><span>Province</span>'+select('jProv', PROVINCES, j.province)+'</label></div>'+
      '<div class="grid2"><label class="field"><span>Work mode</span>'+select('jMode', MODES, j.mode)+'</label><label class="field"><span>Minimum qualification</span>'+select('jQual', QUALS, j.qual)+'</label></div>'+
      '<div class="grid2"><label class="field"><span>Pay per month (rand)</span><input type="number" id="jPay" min="0" step="500" value="'+esc(j.pay)+'"></label><label class="field"><span>Closing date</span><input type="date" id="jCloses" value="'+esc(j.closes)+'"></label></div>'+
      '<label class="field"><span>Skills, separated by commas</span><input type="text" id="jSkills" value="'+esc(j.skills.join(', '))+'"></label>'+
      '<label class="field"><span>Description</span><textarea id="jDesc">'+esc(j.desc)+'</textarea></label>'+
      '<p class="err" id="jErr" hidden></p>'+
      '<div class="actions"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">'+(id?'Save job':'Add job')+'</button></div>'+
    '</form>'
  );
  $('#jForm').addEventListener('submit', function(e){
    e.preventDefault();
    var title=$('#jTitle').value.trim(), company=$('#jCompany').value.trim(), city=$('#jCity').value.trim(), pay=parseInt($('#jPay').value,10), closes=$('#jCloses').value;
    var err=$('#jErr');
    if(!title||!company||!city){ err.textContent='Add a title, company and town or city.'; err.hidden=false; return; }
    if(!(pay>=0)){ err.textContent='Add the monthly pay as a number, like 9000.'; err.hidden=false; return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(closes)){ err.textContent='Choose a closing date.'; err.hidden=false; return; }
    var data = {title:title, company:company, type:$('#jType').value, field:$('#jField').value, city:city, province:$('#jProv').value, mode:$('#jMode').value, qual:$('#jQual').value, pay:pay, closes:closes,
      skills:$('#jSkills').value.split(',').map(function(s){return s.trim();}).filter(Boolean), desc:$('#jDesc').value.trim()||'No description yet.'};
    if(id){ Object.assign(jobById(id), data); toast('Job saved.'); }
    else { data.id='c'+uid(); data.posted=new Date().toISOString().slice(0,10); mem.jobs.unshift(data); toast('Job added.'); }
    save(); closeSheet(); render();
  });
}

/* ---------- Binding ---------- */
function bindView(){
  var v = $('#view');
  $$('[data-go]', v).forEach(function(b){ b.addEventListener('click', function(){ go(b.dataset.go); }); });
  $$('[data-job]', v).forEach(function(b){ b.addEventListener('click', function(){ openJob(b.dataset.job); }); });
  $$('[data-apply]', v).forEach(function(b){ b.addEventListener('click', function(){ var j=jobById(b.dataset.apply); if(apply(b.dataset.apply,'one-tap')) toast('Applied to '+j.title+'.'); render(); }); });

  var lf = $('#loginForm');
  if(lf){
    $('#fillTest').addEventListener('click', function(){ $('#liEmail').value=TEST_EMAIL; $('#liPass').value=TEST_PASS; });
    lf.addEventListener('submit', function(e){
      e.preventDefault();
      var email=$('#liEmail').value.trim().toLowerCase(), pass=$('#liPass').value, u=mem.users[email], err=$('#liErr');
      if(!email||!pass){ err.textContent='Enter your email and password.'; err.hidden=false; return; }
      if(!u || u.pass!==hashPass(pass)){ err.textContent='That email and password do not match an account on this device.'; err.hidden=false; return; }
      mem.session=email; save(); route='jobs'; render(); runAuto(); render();
    });
  }
  var sf = $('#signupForm');
  if(sf) sf.addEventListener('submit', function(e){
    e.preventDefault();
    var name=$('#suName').value.trim(), surname=$('#suSurname').value.trim(), email=$('#suEmail').value.trim().toLowerCase(), pass=$('#suPass').value, err=$('#suErr');
    if(!name||!surname){ err.textContent='Add your name and surname.'; err.hidden=false; return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Enter a valid email address.'; err.hidden=false; return; }
    if(pass.length<6){ err.textContent='Use a password of at least 6 characters.'; err.hidden=false; return; }
    if(mem.users[email]){ err.textContent='An account with that email already exists on this device. Log in instead.'; err.hidden=false; return; }
    mem.users[email]={email:email, pass:hashPass(pass), created:Date.now(), name:name, surname:surname, phone:'', city:'', province:'', qual:'', study:'', institution:'', gradYear:'', skills:[], experience:'',
      prefs:{fields:[],types:[],provinces:[],remote:false,minPay:0}, cv:null, auto:{mode:'one',min:75,paused:false}, lastSeen:Date.now(), photo:null};
    mem.session=email; save(); toast('Account created. Add your CV and preferences to start applying.'); go('profile');
  });

  var q = $('#q');
  if(q){
    q.addEventListener('input', function(){ ui.q=q.value; var pos=q.selectionStart; render(); var n=$('#q'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} });
    $('#fSort').addEventListener('change', function(e){ ui.sort=e.target.value; render(); });
    $('#fType').addEventListener('change', function(e){ ui.type=e.target.value; render(); });
    $('#fField').addEventListener('change', function(e){ ui.field=e.target.value; render(); });
    $('#fProv').addEventListener('change', function(e){ ui.province=e.target.value; render(); });
  }
  [$('#clearF'),$('#clearF2')].forEach(function(b){ if(b) b.addEventListener('click', function(){ ui.q=ui.type=ui.field=ui.province=''; render(); }); });
  var ra = $('#resumeAuto'); if(ra) ra.addEventListener('click', function(){ me().auto.paused=false; save(); runAuto(); render(); });
  var aa = $('#applyAll');
  if(aa) aa.addEventListener('click', function(){
    var u=me(), n=0;
    mem.jobs.forEach(function(j){ if(!isClosed(j) && !appFor(j.id)){ var m=match(u,j); if(m.qualOk && m.locOk && m.score>=u.auto.min && apply(j.id,'one-tap')) n++; } });
    toast('Applied to '+n+' '+(n===1?'job':'jobs')+'.'); render();
  });
  $$('[data-af]', v).forEach(function(b){ b.addEventListener('click', function(){ ui.appFilter=b.dataset.af; render(); }); });

  // Profile
  var eb = $('#editProfile'); if(eb) eb.addEventListener('click', openProfileEdit);
  var av = $('#avatarBtn'); if(av) av.addEventListener('click', function(){ $('#photoInput').click(); });
  var cr = $('#cvReplace'); if(cr) cr.addEventListener('click', function(){ $('#cvInput').click(); });
  var cvv = $('#cvView');
  if(cvv) cvv.addEventListener('click', function(){
    getCv(me().email).then(function(f){
      if(!f){ toast('The CV file is not on this device any more. Upload it again.'); return; }
      var url = URL.createObjectURL(f); var a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    });
  });
  var crm = $('#cvRemove');
  if(crm) crm.addEventListener('click', function(){
    var box = crm.parentNode;
    box.innerHTML = '<div class="confirm" style="flex:1"><span>Remove your CV? Auto-apply stops until you upload one again.</span><div class="actions"><button class="btn danger" id="cvYes">Remove</button><button class="btn" id="cvNo">Keep it</button></div></div>';
    $('#cvYes').addEventListener('click', function(){ var u=me(); delCv(u.email); u.cv=null; save(); toast('CV removed.'); render(); });
    $('#cvNo').addEventListener('click', render);
  });
  $$('[data-mode]', v).forEach(function(b){ b.addEventListener('click', function(){ var u=me(); u.auto.mode=b.dataset.mode; save(); toast(u.auto.mode==='auto'?'Automatic apply is on.':'One-tap apply is on.'); runAuto(true); render(); }); });
  var mm = $('#minMatch');
  if(mm){
    mm.addEventListener('input', function(){ $('#minOut').textContent = mm.value+'%'; });
    mm.addEventListener('change', function(){ me().auto.min=parseInt(mm.value,10); save(); runAuto(); render(); });
  }
  var ps = $('#pauseSw'); if(ps) ps.addEventListener('click', function(){ var u=me(); u.auto.paused=!u.auto.paused; save(); toast(u.auto.paused?'Applying paused.':'Applying resumed.'); runAuto(); render(); });
  var lo = $('#logout'); if(lo) lo.addEventListener('click', function(){ mem.session=null; save(); go('login'); });

  // Admin
  var pf = $('#pinForm');
  if(pf){
    var digits = $$('.pinD');
    digits.forEach(function(d,i){
      d.addEventListener('input', function(){ d.value=d.value.replace(/\D/g,'').slice(-1); if(d.value && digits[i+1]) digits[i+1].focus(); if(digits.every(function(x){return x.value;})) pf.requestSubmit ? pf.requestSubmit() : pf.dispatchEvent(new Event('submit')); });
      d.addEventListener('keydown', function(e){ if(e.key==='Backspace' && !d.value && digits[i-1]) digits[i-1].focus(); });
    });
    digits[0].focus();
    pf.addEventListener('submit', function(e){
      e.preventDefault();
      var pin = digits.map(function(d){ return d.value; }).join('');
      if(pin===mem.pin){ adminOpen=true; render(); }
      else { $('#pinErr').hidden=false; digits.forEach(function(d){ d.value=''; }); digits[0].focus(); }
    });
  }
  var aj = $('#addJob'); if(aj) aj.addEventListener('click', function(){ openJobEdit(null); });
  $$('[data-edit]', v).forEach(function(b){ b.addEventListener('click', function(){ openJobEdit(b.dataset.edit); }); });
  $$('[data-del]', v).forEach(function(b){
    b.addEventListener('click', function(){
      var id=b.dataset.del, j=jobById(id), rowEl=b.closest('.adm-row');
      rowEl.innerHTML = '<div class="confirm" style="flex:1"><span>Delete "'+esc(j.title)+'"? Applications to it stay in the list.</span><div class="actions"><button class="btn danger" data-yes>Delete</button><button class="btn" data-no>Cancel</button></div></div>';
      rowEl.querySelector('[data-yes]').addEventListener('click', function(){ mem.jobs=mem.jobs.filter(function(x){ return x.id!==id; }); save(); toast('Job deleted.'); render(); });
      rowEl.querySelector('[data-no]').addEventListener('click', render);
    });
  });
  var pc = $('#pinChange');
  if(pc) pc.addEventListener('submit', function(e){
    e.preventDefault(); var np=$('#newPin').value.trim(), err=$('#newPinErr');
    if(!/^\d{4}$/.test(np)){ err.textContent='The PIN must be exactly 4 digits.'; err.hidden=false; return; }
    mem.pin=np; save(); toast('Admin PIN changed.'); render();
  });
  var rs = $('#resetAsk');
  if(rs) rs.addEventListener('click', function(){
    $('#resetBox').innerHTML = '<div class="confirm"><span>Reset everything on this device? All accounts except the test account, all applications and all job changes are deleted.</span><div class="actions"><button class="btn danger" id="resetYes">Reset</button><button class="btn" id="resetNo">Cancel</button></div></div>';
    $('#resetYes').addEventListener('click', function(){ Object.keys(mem.users).forEach(function(e){ delCv(e); }); mem=seedState(); save(); adminOpen=false; toast('Test data reset.'); go('login'); });
    $('#resetNo').addEventListener('click', render);
  });
  var la = $('#lockAdmin'); if(la) la.addEventListener('click', function(){ adminOpen=false; go(me()?'profile':'login'); });
}

$$('.tab').forEach(function(t){ t.addEventListener('click', function(){ go(t.dataset.go); }); });

$('#photoInput').addEventListener('change', function(){
  var input=this, file=input.files&&input.files[0]; if(!file||!me()) return;
  var reader=new FileReader();
  reader.onload=function(){
    var raw=new Image();
    raw.onload=function(){
      var size=240, c=document.createElement('canvas'); c.width=size; c.height=size;
      var s=Math.min(raw.width,raw.height); c.getContext('2d').drawImage(raw,(raw.width-s)/2,(raw.height-s)/2,s,s,0,0,size,size);
      me().photo=c.toDataURL('image/jpeg',0.82); save(); render();
    };
    raw.onerror=function(){ toast('That photo could not be opened. Try a JPG or PNG.'); };
    raw.src=reader.result;
  };
  reader.readAsDataURL(file); input.value='';
});
$('#cvInput').addEventListener('change', function(){
  var input=this, file=input.files&&input.files[0], u=me(); if(!file||!u) return;
  input.value='';
  if(!/\.(pdf|docx?)$/i.test(file.name)){ toast('Upload a PDF or Word document.'); return; }
  if(file.size > 5*1024*1024){ toast('That file is over 5 MB. Upload a smaller CV.'); return; }
  putCv(u.email, file).then(function(){
    u.cv={name:file.name, size:file.size, at:Date.now(), sample:false}; save();
    toast('CV uploaded.'); runAuto(); render();
  });
});

/* ---------- Start ---------- */
init();
var h = (location.hash||'').replace('#','');
if(['jobs','applied','profile','admin','login','signup'].indexOf(h)>-1) route = h;
render();
if(me()) runAuto(), render();
// Employers "reply" over time: refresh badges and the open page every 15 seconds
setInterval(function(){
  if($('#sheetWrap')) { var b=unseen(); $('#badge').hidden=!b||route==='applied'; $('#badge').textContent=b; return; }
  var active = document.activeElement;
  if(active && /INPUT|SELECT|TEXTAREA/.test(active.tagName)) return;
  if(me()) runAuto();
  render();
}, 15000);
})();
</script>
